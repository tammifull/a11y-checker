name = "a11y-checker-poc"
account_id = "404b1a9e790573427570fa5a517b72cd"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

browser = { binding = "MYBROWSER" }

# カスタムドメイン a11y-checker.doggo-company.com は保留中:
# doggo-company.com のDNSがXserver運用のため、Cloudflareにゾーン追加（NS移管）が先に必要


[assets]
directory = "public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "f970107db7be47f5866a428c7d24ef9c"

[vars]
# Turnstile テストキー（非表示モード・常に成功）。本番キーはドメイン確定後に差し替え
TURNSTILE_SITE_KEY = "1x00000000000000000000BB"
