name = "a11y-checker-poc"
account_id = "404b1a9e790573427570fa5a517b72cd"
main = "src/index.ts"
compatibility_date = "2026-07-01"
compatibility_flags = ["nodejs_compat"]

browser = { binding = "MYBROWSER" }

# カスタムドメイン設定時にworkers.dev配信が自動無効化されるため、明示的に両方有効にする
workers_dev = true
routes = [
  { pattern = "a11y-checker.doggo-company.com", custom_domain = true }
]


[assets]
directory = "public"
binding = "ASSETS"

[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "f970107db7be47f5866a428c7d24ef9c"

[vars]
# Turnstile 本番サイトキー（管理モード、a11y-checker.doggo-company.com + workers.dev）
# ローカル開発時は .dev.vars のテストキーで上書きされる
TURNSTILE_SITE_KEY = "0x4AAAAAAD1hUFsqsm7SPlYi"
